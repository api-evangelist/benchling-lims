meters:
- name: seats
  description: Licensed named users on the tenant; the primary subscription driver.
  unit: seats
  aggregation: max
  dimensions:
  - tenant
  - application
- name: applications
  description: Which Benchling applications (Registry, Notebook, Inventory, Requests, Insights, Bioprocess) are licensed.
  unit: applications
  aggregation: count
  dimensions:
  - tenant
- name: implementation
  description: One-time onboarding, configuration, migration, and validation services.
  unit: engagement
  aggregation: sum
  dimensions:
  - tenant
- name: api_requests
  description: API request volume - governed by rate-limit quota, not billed per call.
  unit: requests
  aggregation: sum
  dimensions:
  - tenant
  - app
principles:
- name: Visibility
  description: Track licensed seats and applications per tenant; monitor API request volume against rate-limit quotas rather than against a dollar meter.
- name: Allocation
  description: Map seats and applications to teams/programs; use Benchling Apps (with dedicated rate limits) per integration to attribute automated usage.
- name: Optimization
  description: Right-size seat counts and licensed applications at renewal; consolidate integrations onto Benchling Apps to stay within quotas without buying overage; scope validation only where compliance requires it.
- name: Accountability
  description: Assign an owner for the Benchling contract and renewal; review seat utilization and application usage before each annual renewal.
