description: >-
  FinOps view of Benchling spend. Benchling is an enterprise SaaS platform sold
  as an annual, sales-negotiated subscription - typically priced per user/seat
  and per licensed application (Registry, Notebook, Inventory, Requests,
  Insights, Bioprocess, etc.), with implementation/onboarding fees on top. It is
  not consumption/usage-metered like a pay-as-you-go API: the REST API, Benchling
  Apps, events, and webhooks are included capabilities of the commercial tiers
  rather than separately billed line items. The dominant cost drivers are seat
  count, which applications are licensed, contract term, and validation/compliance
  scope (GxP, 21 CFR Part 11). API rate limits are governed by quota, not by
  per-call charges, so heavy programmatic use does not directly increase invoice
  cost - it is constrained by rate limits instead.
notes: >-
  Benchling does not publish list pricing; all figures require a sales quote.
  There is no public usage-based meter for API calls. Model spend as a fixed
  annual subscription (seats x applications) plus one-time implementation, not as
  variable per-request cost. Confirm all terms with Benchling.
