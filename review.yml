aid: benchling-lims
name: Benchling
review:
  question: Does Benchling expose a documented public WebSocket API?
  answer: false
  date: '2026-07-04'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Benchling's own public developer surface
    is a request/response REST API (base https://{tenant}.benchling.com/api/v2).
    Benchling delivers change notifications as EVENTS, not as a WebSocket or SSE
    stream on its own API: clients either poll GET /api/v2/events, or receive
    the same events pushed to AWS EventBridge and to Benchling App webhooks
    (server-to-endpoint HTTP POST). None of these is a bidirectional or
    server-push WebSocket (ws:// / wss://) transport on Benchling's API, so
    there is no WebSocket channel to model.
findings:
  summary: |
    Benchling does not publish a documented public WebSocket API. Benchling is a
    life-sciences R&D cloud (LIMS + electronic lab notebook + molecular biology
    registry + inventory + workflows). Its public developer platform is a
    tenant-scoped REST API at https://{tenant}.benchling.com/api/v2, defined by a
    published OpenAPI spec (benchling.com/api/v2/openapi.yaml, ~325 paths).
    Authentication is HTTP Basic with a personal user API key, or OAuth2 client
    credentials for Benchling Apps (POST /api/v2/token -> Bearer token); OIDC is
    available to act as a specific user with their permissions. Event-driven
    integration is done three ways, none of them WebSocket: (1) polling the REST
    events endpoint GET /api/v2/events; (2) AWS EventBridge, where Benchling
    pushes events to a partner event bus in the customer's AWS account; and
    (3) Benchling App webhooks, where Benchling HTTP POSTs event/canvas payloads
    to an app's registered URL. No realtime, bidirectional, or streaming
    WebSocket (ws:// or wss://) endpoint is documented anywhere in Benchling's
    developer docs as of the review date.
  openSource: |
    The Benchling platform itself is proprietary, closed-source, sales-led
    enterprise SaaS (no self-hostable core). Benchling does publish open-source
    developer tooling on GitHub (github.com/benchling) - notably the official
    Python SDK (benchling-sdk on PyPI), app-examples, and integration-examples -
    but these are clients of the hosted API, not the platform source.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://{tenant}.benchling.com/api/v2
      documented: true
      note: Tenant-scoped v2 REST API defined by benchling.com/api/v2/openapi.yaml. HTTP Basic (user API key) or OAuth2 client credentials (Benchling Apps).
    - protocol: Webhook
      scheme: https
      documented: true
      note: Benchling Apps receive events and canvas interactions as server-to-endpoint HTTP POST webhooks. Not WebSocket.
    - protocol: EventBridge
      scheme: https
      documented: true
      note: Events can be pushed to an AWS EventBridge partner event bus in the customer account. AWS transport, not a Benchling WebSocket.
    - protocol: HTTP Poll
      scheme: https
      documented: true
      note: GET /api/v2/events is a client-initiated poll of the tenant event stream, not server push.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in Benchling's API reference, events docs, webhooks docs, or app framework as of the review date.
