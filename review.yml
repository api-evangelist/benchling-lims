  endpointsModeled:
    note: |
      The curated OpenAPI in openapi/benchling-lims-openapi.yml is a
      representative subset (core CRUD, bulk, and action endpoints per resource)
      of Benchling's full ~325-path published spec. Every path/method it
      contains is grounded in Benchling's own published OpenAPI
      (benchling.com/api/v2/openapi.yaml); it does not invent endpoints. For the
      authoritative, complete, always-current definition, use Benchling's
      published spec directly.
sources:
  - url: https://docs.benchling.com/docs/developer-platform-overview
    type: Documentation
    note: Developer platform overview; tenant-scoped REST API, SDK, apps, events.
  - url: https://benchling.com/api/v2/openapi.yaml
    type: OpenAPI
    note: Benchling's own published OpenAPI 3.0 spec (~325 paths, base /api/v2). Ground truth for all confirmed endpoints.
  - url: https://benchling.com/api/reference
    type: APIReference
    note: Interactive API reference (redirect target of docs.benchling.com/reference). All endpoints are HTTPS REST.
  - url: https://docs.benchling.com/docs/getting-started-benchling-apps
    type: Authentication
    note: HTTP Basic user API keys; OAuth2 client credentials for apps at POST /api/v2/token; OIDC to act as a user. No WebSocket.
  - url: https://docs.benchling.com/docs/rate-limiting
    type: RateLimits
    note: 60 req/30s per tenant (user keys), 300 req/30s per app key, 1000 req/30s all apps; 429 with x-rate-limit-* headers.
  - url: https://docs.benchling.com/docs/events-getting-started
    type: Events
    note: Events via GET /api/v2/events poll and AWS EventBridge. No WebSocket.
  - url: https://docs.benchling.com/docs/getting-started-with-webhooks
    type: Webhooks
    note: Benchling App webhooks are server-to-endpoint HTTP POST. Not WebSocket.
  - url: https://github.com/benchling
    type: SourceCode
    note: Official open-source SDK and examples (clients of the hosted API); the platform itself is proprietary.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Benchling's own public API is
    request/response REST (base https://{tenant}.benchling.com/api/v2), and its
    event delivery is via a REST poll (GET /api/v2/events), AWS EventBridge, and
    HTTP webhooks - none of which is a server-push WebSocket or SSE transport on
    Benchling's own API. No AsyncAPI document was created because there is no
    WebSocket (or SSE) channel on Benchling's API to model.
overlap:
  existingFolder: all/benchling
  note: |
    A separate, older all/benchling entry already exists (aid: benchling,
    type: Index, single monolithic "Benchling REST API", created 2026-06-13).
    It carries the full published Benchling OpenAPI (openapi/benchling-openapi.yaml,
    ~1.1MB, 325 paths) plus graphql/, json-schema/, json-ld/, vocabulary/, and
    examples/. This benchling-lims entry is DISTINCT: it re-frames the same
    provider under the newer 0.19 kind: company model, decomposing the one big
    REST API into 11 logical product APIs (Registry, Sequences, Inventory,
    Notebook, Results/Runs, Workflows, Requests, Events, Apps/Webhooks,
    Org/Users, Blobs/Files) with LIMS-oriented framing. It is partially
    REDUNDANT with all/benchling (same base URL, same underlying API). Flag for
    the maintainer: decide whether to keep both (benchling = raw full-spec index;
    benchling-lims = curated multi-API LIMS view) or consolidate. Benchling does
    NOT have a documented public GraphQL API despite the graphql/ folder in the
    older entry; its public interface is REST v2.
