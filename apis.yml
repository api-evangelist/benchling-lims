aid: benchling-lims
url: https://raw.githubusercontent.com/api-evangelist/benchling-lims/refs/heads/main/apis.yml
name: Benchling
kind: company
description: Benchling is a life-sciences R&D cloud - a unified LIMS, electronic
  lab notebook (ELN), molecular biology registry, sample inventory, and workflow
  platform for biotech and pharma. Its tenant-scoped REST API (v2) exposes the
  same objects scientists work with in the UI - DNA/RNA/protein sequences, custom
  entities and the registry, inventory (boxes, locations, containers, plates),
  notebook entries, assay results and runs, lab-automation transforms, workflow
  tasks, and requests - plus events and webhooks for event-driven automation.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/benchling-lims.png
tags:
- Life Sciences
- Biotech
- LIMS
- Electronic Lab Notebook
- Registry
- Molecular Biology
- Inventory Management
- Assay Management
- Workflows
- Webhooks
- REST
